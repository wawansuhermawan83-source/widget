name: Build Glass Clock APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'app/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Download Montserrat variable font
        run: |
          mkdir -p app/src/main/assets/fonts
          curl -fsSL "https://raw.githubusercontent.com/google/fonts/main/ofl/montserrat/Montserrat%5Bwght%5D.ttf" -o "app/src/main/assets/fonts/Montserrat[wght].ttf"
          curl -fsSL "https://raw.githubusercontent.com/google/fonts/main/ofl/montserrat/OFL.txt" -o "app/src/main/assets/fonts/OFL.txt"
          test -s "app/src/main/assets/fonts/Montserrat[wght].ttf"
          test -s "app/src/main/assets/fonts/OFL.txt"

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Glass-Clock-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
