name: Build Notif Tone Manager APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'NotifToneManager/**'
      - '.github/workflows/build-notif-tone-manager.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Notif Tone Manager
        working-directory: NotifToneManager
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK identity
        run: |
          APK="NotifToneManager/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          SDK="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$SDK/aapt" dump badging "$APK" | grep -q "name='id.wawan.notiftone'"
          "$SDK/aapt" dump badging "$APK" | grep -q "application-label:'Notif Tone Manager'"
          cp "$APK" NotifToneManager-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Notif-Tone-Manager-debug-APK
          path: NotifToneManager-debug.apk
          if-no-files-found: error
          retention-days: 14
